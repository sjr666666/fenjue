<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · 我的拷打树（交互版 · 双项目）</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23,23,23,0.12);
  --brand: #4B3FE3;
  --brand-soft: #F5F6FF;
  --brand-text: #1A1759;
  --accent: #27D2BF;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --warn: #EFAA17;
  --font: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono: "JetBrains Mono",ui-monospace,Consolas,monospace;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229,229,229,0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-text: #CFD8FF;
  --accent: #27D2BF;
  --accent-soft: #123F3C;
  --accent-text: #CCFBF1;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.7 var(--font); }
.wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 60px; }
header.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; margin-bottom: 8px; border-bottom: 1px solid var(--border);
}
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.sub { color: var(--text-muted); font-size: 12px; margin: 4px 0 0; }
.theme-btn {
  background: var(--surface-muted); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.hint {
  display: flex; gap: 8px; align-items: center;
  color: var(--text-muted); font-size: 12px; padding: 10px 0 16px;
}
.hint kbd {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 1px 7px; background: var(--surface-muted); font-family: var(--mono);
}
/* ===== 大块（每个项目一块） ===== */
.region { margin: 24px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.region-head {
  padding: 16px 20px; background: var(--surface-muted);
  border-bottom: 1px solid var(--border);
}
.region-head .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; }
.region-head .name { font-size: 16px; font-weight: 600; }
.region-head .desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }
.region.band .tag { background: var(--brand-soft); color: var(--brand-text); }
.region.ac .tag { background: var(--accent-soft); color: var(--accent-text); }
.region.warn .tag { background: rgba(239,170,23,0.15); color: #B45309; }
html[data-theme="dark"] .region.warn .tag { color: #FBD38D; }
.region-body { padding: 14px 18px; }
/* ===== 节点 ===== */
.node { margin: 6px 0; }
.node > .q-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface-muted); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
  color: var(--text); font-size: 14px; font-weight: 500;
}
.node > .q-btn:hover { border-color: var(--brand); }
.node.open > .q-btn { border-color: var(--brand); }
.node > .q-btn .chev {
  width: 0; height: 0; flex: 0 0 auto;
  border-left: 5px solid transparent; border-right: 5px solid transparent;
  border-top: 6px solid var(--text-muted);
  transition: transform 150ms ease; margin-left: auto;
}
.node.open > .q-btn .chev { transform: rotate(180deg); }
.node > .q-btn .code {
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 30px;
}
.node.band > .q-btn .code { color: var(--brand); }
.node.ac > .q-btn .code { color: var(--accent); }
/* 区块内小标题（如【流程】【拷打】【深挖】） */
.sub-head {
  margin: 18px 0 8px; font-size: 13px; font-weight: 600;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
}
.sub-head::after { content: ""; flex: 1; height: 1px; background: var(--border); }
/* ===== 答案 ===== */
.panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms ease; }
.node.open > .panel { grid-template-rows: 1fr; }
.panel > div { overflow: hidden; }
.panel-inner { padding-left: 16px; padding-top: 6px; }
.ans {
  margin: 6px 0; padding: 10px 14px;
  background: var(--surface); border-left: 3px solid var(--brand); border-radius: 0 8px 8px 0;
}
.node.ac > .panel .ans { border-left-color: var(--accent); }
.ans .lab { font-size: 12px; font-weight: 600; color: var(--brand-text); margin-bottom: 4px; display: block; }
.node.ac > .panel .ans .lab { color: var(--accent-text); }
.ans p { margin: 6px 0; }
.ans ul { margin: 6px 0; padding-left: 20px; }
.ks { font-size: 12px; color: var(--text-muted); }
.principle {
  margin: 6px 0; padding: 8px 12px;
  background: var(--brand-soft); border: 1px dashed var(--brand);
  border-radius: 8px; font-size: 12px; color: var(--brand-text);
}
.node.ac > .panel .principle { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.mono { font-family: var(--mono); font-size: 12px; background: var(--surface-muted); padding: 0 5px; border-radius: 4px; }
.flow-step { margin: 4px 0; padding-left: 2px; }
.sublab { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 8px 0 4px; padding-left: 2px; }
@media print { .theme-btn, .hint kbd { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>03 · 我的拷打树（双项目版）</h1>
      <p class="sub">两个项目各一块 · 每块先讲通整体流程，再往下拷打 · 点击问题展开答案</p>
    </div>
    <button class="theme-btn" id="themeBtn">切换深色模式</button>
  </header>
  <div class="hint"><kbd>▶ 问题</kbd>点击卡片展开答案；【流程】= 一条数据从进来到出去走哪些环节，必答。</div>
  <div id="tree"></div>
</div>

<script>
const DATA = [
  /* ======================= 【项目一】承接端 ======================= */
  {
    cls: 'band', tag: '项目一', name: '多渠道获客数字员工平台（承接端）',
    desc: '7 类 IM 渠道 · 长期驻场数字员工 · 线索沉淀。核心：多渠道接入、消息可靠性、身份权限、并发调度。',
    nodes: [
      { tag: '❤', q: '整条链路怎么跑：一条飞书消息进来，到回复出去，走哪几个环节？', open: true,
        ans: [
          '<strong>一句话</strong>：接入 → 安全前置 → 串行队列 → Agent 执行 → 回复。（每段都能往下一层展开）',
          '<strong>逐环节展开</strong>：',
          '<div class="flow-step">① <strong>接入</strong>：im-manager 维护与飞书等渠道的连接，通过统一 IMChannel 接口收消息——渠道差异在接口层就被收敛。</div>',
          '<div class="flow-step">② <strong>安全前置</strong>：先过处理锁（防同一事件被并发处理）+ 准入门控（evaluateChannelAdmission，未授权发送者直接丢弃）。</div>',
          '<div class="flow-step">③ <strong>身份归一</strong>：scopeChannelJid 把渠道 ID 归一到用户 ID；已绑定走 /pair 信任阶梯，未绑定降级为独立会话。</div>',
          '<div class="flow-step">④ <strong>可靠性落库</strong>：入站先进 Inbox 账本去重（UNIQUE(provider,account_id,external_message_id)），同一消息重投不重复执行。</div>',
          '<div class="flow-step">⑤ <strong>串行队列</strong>：按会话投进 GroupQueue，同一会话同一时刻只有一个 Agent 处理，不同会话并行受容量上限约束。</div>',
          '<div class="flow-step">⑥ <strong>Agent 执行</strong>：Pi Runner 在容器/Host 内跑执行循环，读 Workspace 记忆（防伪造签名），产出回复。</div>',
          '<div class="flow-step">⑦ <strong>出站投递</strong>：回复经 Outbox 账本分阶段投递（幂等键），sendMessage 写回渠道。</div>',
          '<div class="flow-step">⑧ <strong>流式返回</strong>：流式卡片三级降级（打字机→CardKit 全量替换→传统 patch），每 turn 至多一张活跃卡。</div>',
          '<strong>口诀</strong>：接入 → 路由 → Loop → 权限（资源/命令/渠道三层收口）→ 发送。'
        ],
        subs: [
          { q: '消息在哪个环节最容易丢？怎么防？（动机刀）', ans: ['最容易丢的是"回执已提交但游标还没推进"的窗口。解法：双游标（next-pull/committed）分开，启动时四连对账（Inbox/Outbox/流式卡/IPC）一致才放行入站——宁可重放不可丢。'] },
          { q: '同一个客户在多渠道发消息，会当成几个人吗？（边界刀）', ans: ['会，所以有身份归一：渠道 ID 经 scopeChannelJid 归一到统一用户 ID，多端消息进同一会话 threading——这是"身份建模"问题，不是模型推理问题。'] }
        ],
        principle: '整条链路的本质是"先信任、再执行、后投递"：安全前置做信任判别、GroupQueue 保证有序、四账本保证不重不丢、权限三层收口防越权。'
      },
      { tag: 'Q1', q: '为什么做这个项目？业务痛在哪？',
        ans: [
          '<strong>简答</strong>：私域客户散在七类 IM，线索靠表格登记、跟进无沉淀；多个销售团队共用平台，身份与数据边界易串。',
          '<strong>展开</strong>：成功标准是"内容生产→多渠道触达→线索沉淀"闭环跑通；数字员工能长期驻场承接触达、破冰、跟进与画像沉淀。',
          '<strong>诚实答</strong>：规模类数字没有第一手口径，可说验收方式（功能闭环+可靠性语义验证），具体业务量需向导师核实。'
        ],
        subs: [
          { q: '谁在用？一天几次？人工原来多痛？（动机刀）', ans: ['面向企业市场/销售部门；人工痛点=线索靠表格登记、跟进无记录、渠道分散要人工切换。业务量数字按 00 A1/A2 口径答，不编。'] },
          { q: '成功标准怎么度量？（动机刀）', ans: ['两级：业务闭环（内容→触达→线索沉淀）+ 工程语义（消息不丢不重、身份不串、并发不打架）——后者才是能当面试题讲的"度量"。'] },
          { q: '为什么先做 7 个渠道，不先只做企微一个？（替代刀）', ans: ['渠道矩阵决定触达半径，客户私域本来就分散；但统一契约后新增渠道边际成本低。正确顺序是先跑通 2-3 个官方 API 高频渠道，微信个人号/WhatsApp 逆向协议风险渠道列为实验项，不进主链路。'] }
        ] },
      { tag: 'Q2', q: '为什么 AI 是答案？规则/人工不行吗？',
        ans: [
          '<strong>简答</strong>：破冰话术、意向判断是语义问题，规则写不完；但身份、权限、可靠性不是语义问题，收在服务层——"模型提议、系统裁决"。',
          '<strong>展开</strong>：从获客流程拆四段（触达/破冰/跟进/画像沉淀），只有语义理解与表达交给模型。'
        ],
        subs: [
          { q: '哪一步模型必须做？哪一步不该让模型做？（边界刀）', ans: ['必须模型：破冰话术生成、意向判断、话术按客户画像改写（开放语义）；不该给模型：身份归属、权限裁决、消息去重、状态机流转（确定性问题收服务层）。口诀：模型提议、系统裁决。'] },
          { q: '模型被提示注入、想篡改客户画像怎么办？（边界刀）', ans: ['三类防线：①画像写入带 HMAC 能力签名、一次性消费防伪造防重放；②记忆快照声明 trust="historical_data"（历史数据非指令）；③模型不持系统密钥。注入最多影响"它在说什么"，改不了"系统记录什么"。'] },
          { q: '破冰话术用关键词规则，能兜多少？（替代刀）', ans: ['固定意图（进来问价格）规则能兜，开放对话接不住；但规则不浪费——做兜底回退、关键词触发模板，与模型互补不互斥。'] }
        ] },
      { tag: 'Q3', q: '画一下架构，你负责哪块？',
        ans: [
          '<strong>简答</strong>：四层——Backend（唯一有状态中枢：认证/SQLite/队列/调度/授权）→ Pi Runner（无数据库连接、不监听端口，只做 Agent 执行循环）→ Workspace（文件真相唯一锚点）→ 客户端（零令牌、Cookie 化 HTTP+WebSocket）。',
          '<strong>展开</strong>：Runner 与主进程走 stdin/stdout/IPC 目录三条通道而非网络 API。',
          '<strong>诚实答</strong>：Runtime 底座是团队选型复用，我负责应用端的渠道接入、身份模型、可靠性与调度这一层。'
        ],
        subs: [
          { q: 'Runner 为什么不监听端口？不开网络 API 怎么通信？（动机刀）', ans: ['三段式零网络通道：stdin 一次性下发引导载荷、stdout 括号深度分帧输出、文件 IPC 目录承载跟进消息与哨兵（_close/_drain/_interrupt）。选型理由是持久性与跨容器可见性，不是性能；不开端口=攻击面小、载体可透明替换。'] },
          { q: '哪一层是真相锚点？状态会不会多份？（边界刀）', ans: ['SQLite 在 Backend 是唯一可信状态源，Workspace 只管文件真相，runner 不落任何队列语义——不存在两份真相。'] },
          { q: '为什么容器还要分 Host 模式？（替代刀）', ans: ['Container 隔离跑多数渠道；Host 模式是降级/调试通道，spawn 前最后一刻重查 admin+active——"持久化工作区≠授权授予"。隔离优先、活体特权仅作逃生通道。'] }
        ] },
      { tag: 'Q4', q: '微信里的张三和系统里的李雷，怎么知道是同一个人？（身份绑定）',
        ans: [
          '<strong>简答</strong>：身份归一不靠模型猜，靠显式绑定：用户表↔渠道账号表一对多，渠道 ID 带平台前缀；"张三=李雷"必须走绑定流程（优先 unionid，次选手机号验证码、扫码、后台人工确认），绑定后按统一用户 ID 加载全渠道记忆。',
          '<strong>展开</strong>：绑定走 /pair 配对码：入站回调先过 inboundAllowed() 门控，再 scopeChannelJid 作用域归一；绑定来源记在 owner_claim_source 上，分五级信任阶梯（configured/trusted_direct/explicit/auto_feishu/transfer_reset）。还有会话粒度粘性归属（resolveStickyChannelOwner）。',
          '<strong>诚实答</strong>：当时面试我说"测试只接了单渠道"失分——现在能明确：绑定机制设计并实现了（/pair+信任阶梯），从表结构讲到信任分级。'
        ],
        subs: [
          { q: '凭什么证明两个账号是一个人？', ans: ['不能"证明"，只能显式绑定：unionid/手机验证码/扫码/人工，且信任分级。'] },
          { q: '不做绑定会怎样？', ans: ['数据串人、隐私事故；所以未绑定渠道先降级成独立会话，绝不跨渠道合并上下文。'] }
        ],
        principle: '身份归一的本质是把"不可证明的等价关系"变成"可执行的绑定流程"——多端识别不是模型推理问题，是身份建模问题。' },
      { tag: 'Q5', q: '四账本为什么是四张？合成一张不行吗？',
        ans: [
          '<strong>简答</strong>：四张账本对应四种不同的可靠性语义：inbox 管入站去重（UNIQUE(provider, account_id, external_message_id)）、turn_runs 管"这一轮执行"的确定性身份（runId=sha256(logicalKey)，创建即去重）、outbox 管出站分阶段投递（UNIQUE(turn_run_id, ordinal)+payload_hash）、streaming_cards 管流式卡单一活跃（revision CAS）。',
          '<strong>展开</strong>：合并就等于让不同语义的幂等键互相污染——入站去重键和出站投递键天然不同。',
          '<strong>追问"sending 之后超时为什么不能重试"</strong>：可能 Provider 已收到，副作用不可知——fence 为 uncertain 冻结整个 Turn 直到人工裁决，宁可冻结不可重复。'
        ],
        subs: [
          { q: '四张的幂等键为什么各不相同？（动机刀）', ans: ['四种语义针对不同环节的重复来源：入站重复=渠道重投（外部消息 ID）；执行重复=同一逻辑轮被拉起两次（runId 确定性身份）；出站重复=状态机重放（turn_run_id+ordinal+payload_hash）；流式重复=同一 turn 多张活跃卡（revision CAS）。共用一张表=让不同重复来源互相踩幂等键。'] },
          { q: 'sending 超时到底为什么冻结而非重试？（边界刀）', ans: ['写入阶段失败（pending→uploading 等）可安全重试，因为副作用未发生；sending 之后副作用不可知（Provider 可能已收已发），重试=可能重复触达客户——所以 fence uncertain 冻结 Turn 转人工裁决。口诀：先落库再动手/不确定即冻结/恢复尊重租约。'] },
          { q: '用 Redis Stream/BullMQ 不是更主流吗？（替代刀）', ans: ['生产级队列带持久化+消费确认；但当前单机低并发下 SQLite 账本已够，且账本的核心价值是幂等语义设计，不是存储介质——换队列后四账本的分层语义照搬，只换底座。'] }
        ] },
      { tag: 'Q6', q: '10 个用户同时发消息，怎么调度？（并发）',
        ans: [
          '<strong>简答</strong>：入口事件队列 → 按 sessionId/JID 哈希路由 → 同一会话进串行队列（GroupQueue），保证同一会话同一时刻只有一个 Agent 在处理；不同会话并行，但受全局容量上限约束；失败指数退避重试，多次失败转人工。',
          '<strong>展开</strong>：GroupQueue：JID 按 {folder}#{agentId} 解析到 Workspace folder，共享 folder 进同一条串行车道。入队四道闸门——终态丢弃、状态变更挂 MutationPauseToken、活跃检查写 _drain 哨兵、容量检查。失败重试用指数退避（MAX_RETRIES=5，BASE_RETRY_MS=5000）。活性用双时钟，恢复走分级终止 _close 2 秒→docker stop 15 秒→强杀。'
        ],
        principle: '调度的本质是"同一会话必须有序 = 共享写者单线程"，所以按 sessionId 串行化是正确性要求，不是性能优化；并发上限才是性能开关。' },

<script>
(function () {
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  }
  function renderAns(n, cls) {
    var html = '';
    if (n.ans && n.ans.length) {
      html += '<div class="ans">' + (n.ansLabel ? '<span class="lab">' + esc(n.ansLabel) + '</span>' : '');
      n.ans.forEach(function (a) { html += (a.indexOf('<') === 0 ? a : '<p>' + inline(a) + '</p>'); });
      html += '</div>';
    }
    if (n.subs && n.subs.length) {
      html += '<div class="sublab">下钻追问</div>';
      n.subs.forEach(function (s) { html += renderNode(s, cls); });
    }
    if (n.principle) { html += '<div class="principle">💡 ' + inline(n.principle) + '</div>'; }
    return html;
  }
  function renderNode(n, cls) {
    var open = n.open ? ' open' : '';
    return '<div class="node ' + (cls || '') + open + '" data-node>'
      + '<button class="q-btn" data-toggle aria-expanded="' + (n.open ? 'true' : 'false') + '">'
      + '<span class="code">' + esc(n.tag || '→') + '</span>'
      + '<span>' + inline(n.q) + '</span><span class="chev"></span></button>'
      + '<div class="panel"><div class="panel-inner">' + renderAns(n, cls) + '</div></div></div>';
  }
  var html = '';
  DATA.forEach(function (region) {
    var cls = region.cls || '';
    html += '<section class="region ' + cls + '">';
    html += '<div class="region-head"><span class="tag">' + esc(region.tag) + '</span>'
      + '<div class="name">' + esc(region.name) + '</div>'
      + (region.desc ? '<div class="desc">' + esc(region.desc) + '</div>' : '') + '</div>'
      + '<div class="region-body">' + region.nodes.map(function (n) { return renderNode(n, cls); }).join('') + '</div></section>';
  });
  document.getElementById('tree').innerHTML = html;

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    var node = btn.closest('[data-node]');
    if (!node) return;
    var open = node.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    });
  }
})();
</script>
</body>
