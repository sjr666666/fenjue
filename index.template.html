<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3A7BC8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的焚诀">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>我的焚诀 · 面试作战手册</title>
<style>
:root {
  --bg: #F4F6F9;
  --card: #FFFFFF;
  --text: #1F2937;
  --muted: #6B7280;
  --border: #E3E7EE;
  --brand: #3A7BC8;
  --brand-deep: #2C5F9E;
  --brand-soft: #EBF2FA;
  --code-bg: #EEF1F5;
  --mark-bg: #FDEFA8;
  --shadow: 0 1px 3px rgba(16,24,40,.05);
  --doc-base: 15px;   /* 字号基准：手机 */
  --doc-size: 15px;    /* 实际字号，由 JS 按基准与档位计算 */
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #0F1420;
  --card: #1A2233;
  --text: #D7DEE9;
  --muted: #8A94A6;
  --border: #2A3448;
  --brand: #5B9BD5;
  --brand-deep: #7FB3E2;
  --brand-soft: #1E2C42;
  --code-bg: #232D42;
  --mark-bg: #665C1E;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.7 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
a { color: var(--brand); text-decoration: none; }
button { font-family: inherit; }

/* ===== 顶部栏 ===== */
header.app {
  position: sticky; top: 0; z-index: 50;
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.app-inner {
  max-width: 760px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
}
.logo {
  width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px;
  background: linear-gradient(135deg, #3A7BC8, #6FA8DC);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.app-title { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
.app-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; transition: border-color .15s;
}
.icon-btn:active { border-color: var(--brand); }
.icon-btn svg { width: 16px; height: 16px; }

/* ===== 进度条 ===== */
.progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--brand), #6FA8DC);
  z-index: 60; transition: width .1s linear; display: none;
}
.progress.on { display: block; }

/* ===== 首页 ===== */
main { max-width: 760px; margin: 0 auto; padding: 14px 14px calc(76px + env(safe-area-inset-bottom)); }
.hero {
  background: linear-gradient(135deg, var(--brand-soft), transparent 70%);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-bottom: 14px;
}
.hero .who { font-size: 15px; font-weight: 600; }
.hero .line { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
.hero .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hero .tag {
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border); color: var(--brand);
  font-weight: 500;
}
/* 搜索 */
.search-box { position: relative; margin-bottom: 18px; }
.search-box svg.mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
.search-box input {
  width: 100%; padding: 10px 38px 10px 34px; font-size: 14px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); outline: none;
  font-family: inherit; transition: border-color .15s;
}
.search-box input:focus { border-color: var(--brand); }
.search-box .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--code-bg); color: var(--muted); font-size: 13px; display: none;
}
.search-box.has-q .clear { display: block; }
.search-hint { font-size: 12px; color: var(--muted); margin: -10px 0 14px; padding-left: 2px; }

/* 分类 */
.cat { margin-bottom: 20px; }
.cat-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; padding: 0 2px; }
.cat-icon {
  width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
}
.cat-icon svg { width: 15px; height: 15px; }
.cat-name { font-size: 14.5px; font-weight: 600; }
.cat-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.cat-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 620px) { .cat-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.doc-card {
  min-width: 0; display: flex; align-items: center; gap: 11px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; cursor: pointer;
  box-shadow: var(--shadow); transition: border-color .15s, transform .1s;
}
.doc-card:active { border-color: var(--brand); }
.doc-num {
  font-size: 12px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); border-radius: 8px;
  min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto; letter-spacing: .5px;
}
.doc-card .info { flex: 1; min-width: 0; }
.doc-card .t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.doc-card .d { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-card .chev { color: var(--muted); flex: 0 0 auto; width: 14px; height: 14px; }
.badge {
  font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 500;
  background: var(--brand-soft); color: var(--brand); border: 1px solid transparent;
}
.badge.warn { background: transparent; border-color: var(--border); color: var(--muted); }
.pill-pdf .doc-num { font-size: 11px; }

/* 搜索结果 */
.hit-snippet { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
mark { background: var(--mark-bg); color: inherit; border-radius: 3px; padding: 0 2px; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }

/* ===== 文档页 ===== */
.doc-topbar {
  position: sticky; top: var(--header-h, 53px); z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: none;
}
.doc-topbar.on { display: block; }
.doc-topbar .row {
  max-width: 760px; margin: 0 auto; padding: 8px 12px;
  display: flex; align-items: center; gap: 8px;
}
.back-btn {
  display: flex; align-items: center; gap: 4px; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); border-radius: 9px;
  padding: 6px 10px; font-size: 13px; color: var(--text); flex: 0 0 auto;
}
.back-btn:active { border-color: var(--brand); }
.doc-topbar .title {
  flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.size-btn { width: auto; min-width: 32px; padding: 0 8px; font-size: 12px; }

/* 交互版横幅 */
.interactive-banner {
  display: none; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 14px 0 4px; padding: 10px 14px;
  background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent);
  border-radius: 12px; font-size: 12.5px;
}
.interactive-banner.on { display: flex; }
.interactive-banner a { font-weight: 600; flex: 0 0 auto; }
.interactive-banner .go { display: inline-flex; align-items: center; gap: 3px; }

/* ===== Markdown 正文 ===== */
article.md { padding-top: 14px; font-size: var(--doc-size); overflow-x: clip; }
article.md p, article.md li, article.md blockquote, article.md h1, article.md h2,
article.md h3, article.md h4, article.md td, article.md th, article.md dd { overflow-wrap: anywhere; }
article.md > :first-child { margin-top: 0; }
article.md h1 {
  font-size: 21px; line-height: 1.4; margin: 8px 0 6px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border); letter-spacing: .3px;
}
article.md h2 {
  font-size: 17px; margin: 26px 0 10px; padding-left: 10px;
  border-left: 4px solid var(--brand); line-height: 1.4;
  scroll-margin-top: calc(var(--header-h, 53px) + 66px);
}
article.md h3 { font-size: 15px; margin: 20px 0 8px; scroll-margin-top: 110px; }
article.md h4 { font-size: 14px; margin: 16px 0 6px; color: var(--muted); }
article.md p { margin: 9px 0; }
article.md ul, article.md ol { margin: 9px 0; padding-left: 22px; }
article.md li { margin: 4px 0; }
article.md li::marker { color: var(--brand); }
article.md li.task-list-item { list-style: none; margin-left: -18px; }
article.md li.task-list-item input { margin-right: 7px; accent-color: var(--brand); width: 15px; height: 15px; vertical-align: -2px; }
article.md blockquote {
  margin: 12px 0; padding: 10px 14px;
  background: var(--brand-soft); border-left: 3px solid var(--brand);
  border-radius: 0 10px 10px 0; color: var(--text);
}
article.md blockquote p { margin: 5px 0; }
article.md blockquote p:first-child { margin-top: 0; }
article.md blockquote p:last-child { margin-bottom: 0; }
article.md code {
  font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
  font-size: .86em; background: var(--code-bg);
  padding: 2px 6px; border-radius: 6px; word-break: break-all;
}
article.md pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 12px 0;
}
article.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.7; }
.table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; }
article.md table { border-collapse: collapse; width: 100%; font-size: 13px; }
article.md th, article.md td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
article.md th { background: var(--brand-soft); font-weight: 600; white-space: nowrap; }
article.md tr:last-child td { border-bottom: none; }
article.md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
article.md img { max-width: 100%; border-radius: 10px; }
article.md strong { color: var(--brand-deep); }
html[data-theme="dark"] article.md strong { color: #9CC5EC; }

/* ===== 豪言豪语：渐进式披露 ===== */
.disclosure-guide {
  margin: 14px 0 18px; padding: 12px 14px;
  background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 28%, transparent);
  border-radius: 10px; font-size: 12.5px; line-height: 1.7;
}
.disclosure-guide b { color: var(--brand-deep); }
.progressive-item {
  margin: 12px 0; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  scroll-margin-top: calc(var(--header-h, 53px) + 66px);
}
.progressive-item[open] { border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); }
.progressive-item > summary {
  list-style: none; cursor: pointer; padding: 12px 14px;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 9px; align-items: center;
  font-size: 15px; font-weight: 600;
}
.progressive-item > summary::-webkit-details-marker { display: none; }
.progressive-item > summary::after {
  content: "+"; grid-column: 1; grid-row: 1 / span 2; width: 24px; height: 24px;
  display: grid; place-items: center; border-radius: 7px; background: var(--brand-soft); color: var(--brand);
  font-size: 18px; font-weight: 400; line-height: 1;
}
.progressive-item[open] > summary::after { content: "−"; }
.progressive-item > summary small { grid-column: 2; color: var(--muted); font-size: 11.5px; font-weight: 400; }
.progressive-answer { padding: 0 14px 14px; border-top: 1px solid var(--border); }
.progressive-answer > :first-child { margin-top: 12px; }
.source-disclosure {
  margin: 14px 0 2px; border-top: 1px dashed var(--border); padding-top: 4px;
}
.source-disclosure > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; padding: 7px 0; }
.source-disclosure[open] > summary { color: var(--brand); }

/* ===== 上/下篇 ===== */
.doc-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 30px; }
.doc-nav a {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 14px; box-shadow: var(--shadow);
}
.doc-nav a:active { border-color: var(--brand); }
.doc-nav .lab { font-size: 11px; color: var(--muted); }
.doc-nav .t { font-size: 13px; font-weight: 600; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-nav a.next { text-align: right; }

/* ===== TOC 抽屉 ===== */
.toc-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toc-mask.on { opacity: 1; pointer-events: auto; }
.toc-panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 71;
  background: var(--card); border-radius: 16px 16px 0 0;
  max-height: 62vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .22s ease;
  padding-bottom: env(safe-area-inset-bottom);
}
.toc-panel.on { transform: translateY(0); }
.toc-head {
  padding: 13px 18px 9px; border-bottom: 1px solid var(--border);
  font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  flex: 0 0 auto;
}
.toc-close { background: none; border: none; color: var(--muted); font-size: 17px; cursor: pointer; padding: 2px 6px; }
.toc-list { overflow-y: auto; padding: 8px 12px 16px; }
.toc-list a {
  display: block; padding: 8px 12px; border-radius: 9px;
  color: var(--text); font-size: 13.5px;
}
.toc-list a:active, .toc-list a:hover { background: var(--brand-soft); }
.toc-list a.lv3 { padding-left: 30px; color: var(--muted); font-size: 12.5px; }

footer.app { text-align: center; color: var(--muted); font-size: 11.5px; padding: 26px 0 6px; }
footer.app a { color: var(--muted); }

/* ===== 移动端 / 平板适配（2026-09-17） ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overscroll-behavior-y: contain; }
button, a { touch-action: manipulation; }

/* 触控热区 */
@media (pointer: coarse) {
  .icon-btn { width: 40px; height: 40px; }
  .back-btn { padding: 9px 12px; }
  .search-box .clear { width: 32px; height: 32px; font-size: 15px; }
  .doc-card { padding: 13px 14px; }
  .toc-list a { padding: 12px; }
  .toc-close { font-size: 22px; padding: 4px 10px; }
}

/* 横滑容器：跟手滚动，避免橡皮筋带回层 */
.table-wrap, article.md pre, .mermaid-viewport {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

/* ===== 手机 ===== */
@media (max-width: 560px) {
  :root { --header-h: 49px; }
  .app-inner { padding: 8px 12px; gap: 8px; }
  .logo { width: 28px; height: 28px; font-size: 14px; }
  .app-title { font-size: 15px; }
  .app-sub { display: none; }
  main { padding: 12px 12px calc(78px + env(safe-area-inset-bottom)); }
  .hero { padding: 13px 14px; }
  /* 16px 可避免 iOS 聚焦输入框时把整页放大 */
  .search-box input { font-size: 16px; padding: 11px 40px 11px 34px; }
  .doc-topbar .row { padding: 7px 10px; gap: 6px; }
  .doc-topbar .title { font-size: 12.5px; }
  .back-btn { font-size: 12.5px; padding: 8px 9px; }
  .size-btn { min-width: 36px; }
  article.md h1 { font-size: 19px; }
  article.md h2 { font-size: 16px; margin: 22px 0 9px; }
  article.md h3 { font-size: 14.5px; margin: 17px 0 7px; }
  article.md ul, article.md ol { padding-left: 19px; }
  article.md blockquote { padding: 9px 12px; }
  article.md pre { padding: 11px 12px; border-radius: 9px; }
  article.md table { font-size: 12.5px; }
  article.md th, article.md td { padding: 7px 10px; }
  .doc-nav { grid-template-columns: 1fr; gap: 7px; }
  .doc-nav a.next { text-align: left; }
  .doc-nav .t { white-space: normal; }
  .toc-panel { max-height: 76vh; }
  .progressive-item > summary { padding: 12px; font-size: 14.5px; }
  .progressive-answer { padding: 0 12px 12px; }
  .mermaid-viewport { padding: 12px 10px; }
}

/* 手机横屏：压缩纵向占位 */
@media (max-width: 900px) and (orientation: landscape) {
  main { padding-top: 8px; }
  .toc-panel { max-height: 88vh; }
}

/* ===== 平板 ===== */
@media (min-width: 700px) {
  :root { --doc-base: 16px; }   /* 平板基准字号加大，阅读更省力 */
  main { max-width: 800px; padding: 18px 20px calc(72px + env(safe-area-inset-bottom)); }
  .app-inner, .doc-topbar .row { max-width: 800px; padding-left: 20px; padding-right: 20px; }
  .hero { padding: 18px 20px; }
  .cat-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .doc-nav { margin-top: 34px; }
  article.md { line-height: 1.78; }
  article.md h2 { font-size: 18px; }
  article.md h3 { font-size: 15.5px; }
  article.md li { margin: 5px 0; }
}

/* 大屏 / 横屏平板：目录改右侧抽屉，正文上限放宽 */
@media (min-width: 1000px) {
  main { max-width: 840px; }
  .app-inner, .doc-topbar .row { max-width: 840px; }
  .toc-panel {
    left: auto; right: 0; top: 0; bottom: 0; width: 340px;
    max-height: none; border-radius: 16px 0 0 16px;
    transform: translateX(100%);
    box-shadow: -8px 0 28px rgba(16,24,40,.16);
  }
  .toc-panel.on { transform: translateX(0); }
  .toc-head { padding-top: calc(14px + env(safe-area-inset-top)); }
  .toc-list { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
}

/* ===== 表格 / 代码横滑提示 ===== */
.scroll-hint {
  font-size: 11.5px; color: var(--muted); margin: -6px 2px 12px;
  display: flex; align-items: center; gap: 5px;
}
.scroll-hint::before { content: ""; font-size: 12px; color: var(--brand); }

/* ===== 回到顶部 ===== */
.totop {
  position: fixed; right: calc(14px + env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 65; width: 44px; height: 44px; border-radius: 50%;
  background: var(--card); color: var(--brand);
  border: 1px solid color-mix(in srgb, var(--brand) 34%, var(--border));
  box-shadow: 0 6px 18px rgba(16,24,40,.16);
  cursor: pointer; display: grid; place-items: center;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
}
.totop.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
.totop svg { width: 19px; height: 19px; }
@media (pointer: coarse) { .totop { width: 48px; height: 48px; } }

/* ===== Mermaid 图表 ===== */
/* 溢出容器里居中会把左端顶出可视区，故未适配宽度时左对齐 */
.mermaid-viewport { text-align: left; }
.mermaid-viewport.fit { text-align: center; }
.mermaid-viewport.fit svg { margin: 0 auto; }
.mermaid-viewport:not(.fit) svg { margin: 0; }
.mermaid-block {
  margin: 16px 0; border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); overflow: hidden;
}
.mermaid-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 12px; border-bottom: 1px solid var(--border);
  background: var(--brand-soft); font-size: 12px; color: var(--muted);
}
.mermaid-bar b { color: var(--brand-deep); font-size: 12px; font-weight: 600; }

}
function resetList() {
  const hint = $('#searchHint'); if (hint) { hint.style.display = 'none'; hint.textContent = ''; }
  const list = $('#docList'); if (!list) return;
  const scroll = window.scrollY;
  app.querySelectorAll('.doc-card').forEach(c => { c.style.display = ''; });
  app.querySelectorAll('.cat').forEach(s => { s.style.display = ''; });
  app.querySelectorAll('.hit-snippet').forEach(s => s.remove());
  app.querySelectorAll('.doc-card .d').forEach(s => { if (s.style.display === 'none') s.style.display = ''; });
  window.scrollTo(0, scroll);
}
async function runSearch(q) {
  const hint = $('#searchHint'), list = $('#docList');
  if (!hint || !list) return;
  hint.style.display = 'block';
  hint.textContent = '正在搜索正文…';
  const lower = q.toLowerCase();
  const results = [];
  await Promise.all(DOCS.map(async d => {
    let raw;
    try { raw = await fetchMd(d.file); } catch (e) { return; }
    const idx = raw.toLowerCase().indexOf(lower);
    const count = raw.toLowerCase().split(lower).length - 1;
    if (idx >= 0) {
      const start = Math.max(0, idx - 26);
      let frag = raw.slice(start, idx + q.length + 46).replace(/[#*`>|_\-\n\r]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (start > 0) frag = '…' + frag;
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      results.push({ d, count, snippet: esc(frag).replace(re, '<mark>$1</mark>') });
    }
  }));
  results.sort((a, b) => b.count - a.count);
  hint.textContent = `全文搜索「${q}」：命中 ${results.length} 篇`;
  app.querySelectorAll('.cat').forEach(s => { s.style.display = 'none'; });
  app.querySelectorAll('.doc-card').forEach(c => { c.style.display = 'none'; });
  if (!results.length) {
    list.insertAdjacentHTML('beforeend', `<div class="empty" id="noHit">没有找到包含「${esc(q)}」的内容</div>`);
  } else {
    for (const r of results) {
      const card = app.querySelector(`.doc-card[data-id="${r.d.id}"]`);
      if (card) {
        card.style.display = '';
        card.querySelector('.d').style.display = 'none';
        card.insertAdjacentHTML('afterbegin', '');
        card.querySelector('.info').insertAdjacentHTML('beforeend', `<div class="hit-snippet">${r.snippet} <span style="opacity:.6">(${r.count} 处)</span></div>`);
        card.closest('.cat').style.display = '';
      }
    }
  }
}

/* ================= 文档页 ================= */
async function showDoc(id) {
  savePos();
  const d = docById(id);
  curDocId = id;
  document.title = d.title + ' · 我的焚诀';
  $('#docTopbar').classList.add('on');
  $('#topbarTitle').textContent = d.num + ' · ' + d.title;
  $('#progress').classList.add('on');
  app.innerHTML = `<div class="loading">正在加载${esc(d.title)}<span class="dots"></span></div>`;
  window.scrollTo(0, 0);
  let raw;
  try { raw = await fetchMd(d.file); }
  catch (e) {
    app.innerHTML = `<div class="error-box">加载失败（${esc(e.message)}）。若在本地直接打开本文件，浏览器会拦截文件读取——请通过 http 访问，或部署在 GitHub Pages 上使用。</div>`;
    return;
  }
  const html = marked.parse(raw);
  const idx = DOCS.findIndex(x => x.id === id);
  const prev = DOCS[idx - 1], next = DOCS[idx + 1];
  const banner = d.interactive
    ? `<div class="interactive-banner on"><span>本文有交互版拷打树（86 个问题节点，点击展开答案，手机可离线用）</span><a class="go" href="./${encodeURIComponent(d.interactive)}">打开交互版 →</a></div>`
    : '';
  app.innerHTML = `${banner}<article class="md" id="article">${html}</article>
  <div class="doc-nav">
    ${prev ? `<a href="#/doc/${prev.id}"><div class="lab">← 上一篇</div><div class="t">${esc(prev.num)} · ${esc(prev.title)}</div></a>` : '<span></span>'}
    ${next ? `<a class="next" href="#/doc/${next.id}"><div class="lab">下一篇 →</div><div class="t">${esc(next.num)} · ${esc(next.title)}</div></a>` : '<span></span>'}
  </div>
  <footer class="app">${esc(d.num)} · ${esc(d.title)} · <a href="#/">返回首页</a></footer>`;
  postProcess($('#article'));
  buildToc();
  const pos = store.get('pos-' + id, 0);
  requestAnimationFrame(() => window.scrollTo(0, pos || 0));
}
/* ===== 移动端适配：视口高度 / 回到顶部 / 图表缩放 ===== */
function syncHeaderHeight() {
  const h = document.querySelector('header.app');
  if (!h) return;
  document.documentElement.style.setProperty('--header-h', Math.round(h.getBoundingClientRect().height) + 'px');
}
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
syncHeaderHeight();

const toTop = $('#toTop');
let toTopVisible = false;
function syncToTop() {
  const show = window.scrollY > 600;
  if (show === toTopVisible) return;
  toTopVisible = show;
  toTop.classList.toggle('on', show);
}
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

/* 图表渲染完成或窗口尺寸变化后，重新评估是否需要横滑提示 */
function markSettledScrollHints(root) {
  const scope = root || document;
  requestAnimationFrame(() => {
    scope.querySelectorAll('.table-wrap').forEach(w => addScrollHint(w, '表格较宽，可左右滑动查看'));
    scope.querySelectorAll('pre').forEach(p => addScrollHint(p, '代码较宽，可左右滑动查看'));
  });
}
/* 横滑提示：手机上看不全的表格 / 代码块给出滑动指引 */
function addScrollHint(el, text) {
  if (!el || el.dataset.hintDone === '1') return;
  el.dataset.hintDone = '1';
  if (el.scrollWidth <= el.clientWidth + 2) return;
  const hint = document.createElement('div');
  hint.className = 'scroll-hint';
  hint.textContent = text;
  el.insertAdjacentElement('afterend', hint);
}

/* 图表放大查看 */
let zoomScale = 1;
let zoomSvg = null;
function zoomApply() {
  if (!zoomSvg) return;
  const base = Number(zoomSvg.dataset.baseWidth) || zoomSvg.getBoundingClientRect().width;
  zoomSvg.style.width = Math.round(base * zoomScale) + 'px';
}
function openZoom(svg, title) {
  zoomSvg = svg.cloneNode(true);
  zoomScale = 1;
  const natural = svg.getAttribute('width') ? parseFloat(svg.getAttribute('width')) : svg.getBoundingClientRect().width;
  zoomSvg.dataset.baseWidth = String(natural || 900);
  zoomSvg.removeAttribute('height');
  zoomSvg.style.width = Math.round(natural || 900) + 'px';
  const body = $('#zoomBody');
  body.scrollTop = 0; body.scrollLeft = 0;
  body.replaceChildren(zoomSvg);
  $('#zoomTitle').textContent = title || '图表';
  $('#zoomView').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeZoom() {
  $('#zoomView').classList.remove('on');
  $('#zoomBody').replaceChildren();
  zoomSvg = null;
  document.body.style.overflow = '';
}
$('#zoomIn').onclick = () => { zoomScale = Math.min(6, zoomScale * 1.25); zoomApply(); };
$('#zoomOut').onclick = () => { zoomScale = Math.max(0.3, zoomScale / 1.25); zoomApply(); };
$('#zoomReset').onclick = () => { zoomScale = 1; zoomApply(); };
$('#zoomClose').onclick = closeZoom;
window.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#zoomView').classList.contains('on')) closeZoom(); });

/* ===== Mermaid 图表渲染 ===== */
const MERMAID_SRC = './mermaid.min.js';
let mermaidPromise = null;
let mermaidSeq = 0;
const mermaidSources = new Map();

function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = MERMAID_SRC;
    s.async = true;
    s.onload = () => window.mermaid ? resolve(window.mermaid) : reject(new Error('mermaid 未就绪'));
    s.onerror = () => reject(new Error('mermaid.min.js 加载失败'));
    document.head.appendChild(s);
  });
  mermaidPromise = mermaidPromise.catch(e => { mermaidPromise = null; throw e; });
  return mermaidPromise;
}

function mermaidTheme() {
  return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default';
}
function mermaidTitleFor(el) {
  let node = el;
  while (node && node !== document.body) {
    let prev = node.previousElementSibling;
    while (prev) {
      if (/^H[1-4]$/.test(prev.tagName)) return prev.textContent.trim().slice(0, 40);
      prev = prev.previousElementSibling;
    }
    node = node.parentElement;
    if (node && /^H[1-4]$/.test(node.tagName)) return node.textContent.trim().slice(0, 40);
  }
  return '';
}

async function renderMermaid(root) {
  const codes = [...root.querySelectorAll('pre > code.language-mermaid, pre > code.lang-mermaid')];
  if (!codes.length) return;
  const blocks = codes.map(code => {
    const pre = code.parentElement;
    const holder = document.createElement('div');
    holder.className = 'mermaid-block';
    holder.innerHTML = '<div class="mermaid-loading">正在绘制图表…</div>';
    holder.dataset.title = mermaidTitleFor(pre);
    holder.dataset.mmd = code.textContent;
    mermaidSources.set(holder.dataset.mmd, holder.dataset.title);
    const orphan = pre.nextElementSibling;
    if (orphan && orphan.classList && orphan.classList.contains('scroll-hint')) orphan.remove();
    pre.replaceWith(holder);
    return holder;
  });

  let mmd;
  try { mmd = await loadMermaid(); }
  catch (e) {
    blocks.forEach(b => { b.innerHTML = '<div class="mermaid-error">图表组件加载失败（' + esc(e.message) + '），以下为源码：</div><pre><code>' + esc(b.dataset.mmd) + '</code></pre>'; });
    return;
  }

  try {
    mmd.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: mermaidTheme(),
      themeVariables: {
        fontFamily: '"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif',
        fontSize: '15px',
      },
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
      sequence: { useMaxWidth: false, actorMargin: 46, boxMargin: 8, wrap: false },
    });
  } catch (e) { /* initialize 失败不阻断，继续尝试 render */ }

  for (const holder of blocks) {
    const idx = ++mermaidSeq;
    const title = holder.dataset.title || ('图表 ' + idx);
    try {
      const { svg } = await mmd.render('mmd-' + idx + '-' + Date.now(), holder.dataset.mmd);
      const wrap = document.createElement('div');
      wrap.className = 'mermaid-bar';
      wrap.innerHTML = '<b>' + esc(title) + '</b><span class="spacer"></span>'
        + '<button class="mermaid-btn" data-fit>适应宽度</button>'
        + '<button class="mermaid-btn" data-zoom>放大查看</button>';
      const view = document.createElement('div');
      view.className = 'mermaid-viewport';
      view.innerHTML = svg;
      const note = document.createElement('div');
      note.className = 'mermaid-note';
      note.textContent = '手机 / 平板：图宽超出屏幕时可左右滑动，或点“放大查看”。';
      holder.replaceChildren(wrap, view, note);
      const svgEl = view.querySelector('svg');
      if (svgEl) {
        svgEl.dataset.title = title;
        const w = parseFloat(svgEl.getAttribute('width')) || svgEl.getBoundingClientRect().width;
        svgEl.dataset.baseWidth = String(w);
        // 图比容器窄就直接居中，比容器宽则保持原始宽度并允许横滑
        if (w && w <= view.clientWidth + 4) view.classList.add('fit');
        note.style.display = (w && w > view.clientWidth + 4) ? '' : 'none';
      }
      wrap.querySelector('[data-fit]').onclick = e => {
        const on = view.classList.toggle('fit');
        e.currentTarget.textContent = on ? '原始大小' : '适应宽度';
        if (svgEl) svgEl.style.width = on ? '100%' : (svgEl.dataset.baseWidth + 'px');
      };
      wrap.querySelector('[data-zoom]').onclick = () => openZoom(svgEl, title);
    } catch (e) {
      holder.replaceChildren(Object.assign(document.createElement('div'), {
        className: 'mermaid-error',
        innerHTML: '该图渲染失败（' + esc(e.message || '语法错误') + '），以下为源码：'
      }));
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = holder.dataset.mmd;
      pre.appendChild(code);
      holder.appendChild(pre);
    }
  }
}

/* 切换主题后重画图表，保证配色跟随主题 */
let mermaidRerenderTimer = null;
function rerenderMermaid() {
  const blocks = [...document.querySelectorAll('#article .mermaid-block[data-mmd]')];
  if (!blocks.length) return;
  clearTimeout(mermaidRerenderTimer);
  mermaidRerenderTimer = setTimeout(() => {
    blocks.forEach(b => {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.className = 'language-mermaid';
      code.textContent = b.dataset.mmd;
      pre.appendChild(code);
      b.replaceWith(pre);
    });
    const article = $('#article');
    if (article) renderMermaid(article);
  }, 0);
}

function postProcess(root) {
  root.querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('table-wrap')) return;
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  root.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  root.querySelectorAll('h2, h3').forEach((h, i) => { if (!h.id) h.id = 'h-' + i; });
  addProgressiveDisclosure(root);

  // 先渲染图表：mermaid 源码 pre 会被替换成图表容器，
  // 若先挂横滑提示会留下孤立提示节点
  renderMermaid(root);
  root.querySelectorAll('.table-wrap').forEach(w => addScrollHint(w, '表格较宽，可左右滑动查看'));
  root.querySelectorAll('pre').forEach(p => addScrollHint(p, '代码较宽，可左右滑动查看'));

}

function addProgressiveDisclosure(root) {
  if (curDocId !== '14') return;
  const section = [...root.querySelectorAll('h2')].find(h => h.textContent.startsWith('逐条：'));
  if (!section) return;

  const guide = document.createElement('div');
  guide.className = 'disclosure-guide';
  guide.innerHTML = '<b>三层复习</b>：先扫一页纸，追问时展开“我的回答”，需要推导和边界时再打开原话。';
  section.insertAdjacentElement('beforebegin', guide);

  let heading = section.nextElementSibling;
  let number = 0;
  while (heading && heading.tagName !== 'H2') {
    if (heading.tagName !== 'H3') { heading = heading.nextElementSibling; continue; }
    number += 1;
    const title = heading.textContent;
    const id = heading.id;
    const content = [];
    let cursor = heading.nextElementSibling;
    while (cursor && cursor.tagName !== 'H2' && cursor.tagName !== 'H3') {
      const next = cursor.nextElementSibling;
      content.push(cursor);
      cursor = next;
    }

    const sourceStart = content.findIndex(node => node.textContent.trim().startsWith('往里豪原话'));
    const mineStart = content.findIndex(node => node.textContent.trim().startsWith('我的版'));
    const source = sourceStart >= 0 && mineStart > sourceStart ? content.slice(sourceStart, mineStart) : [];
    const answer = source.length ? content.slice(0, sourceStart).concat(content.slice(mineStart)) : content;

    const item = document.createElement('details');
    item.className = 'progressive-item';
    item.id = id;
    item.dataset.tocTitle = title;
    const summary = document.createElement('summary');
    summary.innerHTML = `<span>${number}. ${esc(title.replace(/^\d+\.\s*/, ''))}</span><small>展开我的回答与证据</small>`;
    const body = document.createElement('div');
    body.className = 'progressive-answer';
    answer.forEach(node => body.appendChild(node));
    if (source.length) {
      const sourceDetails = document.createElement('details');
      sourceDetails.className = 'source-disclosure';
      const sourceSummary = document.createElement('summary');
      sourceSummary.textContent = '查看观点来源的完整原话（非本人经历）';
      sourceDetails.appendChild(sourceSummary);
      source.forEach(node => sourceDetails.appendChild(node));
      body.appendChild(sourceDetails);
    }
    item.append(summary, body);
    heading.replaceWith(item);
    heading = cursor;
  }
}

/* ================= TOC ================= */
function buildToc() {
  const list = $('#tocList');
  const hs = document.querySelectorAll('#article h2, #article h3, #article .progressive-item[data-toc-title]');
  let out = '';
  hs.forEach(h => {
    const title = h.dataset.tocTitle || h.textContent;
    const isItem = h.classList.contains('progressive-item');
    out += `<a href="#${h.id}" class="${h.tagName === 'H3' || isItem ? 'lv3' : ''}" data-target="${h.id}">${esc(title)}</a>`;
  });
  list.innerHTML = out || '<a>本页无小标题</a>';
  list.querySelectorAll('a[data-target]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      closeToc();
      setTimeout(() => {
        const el = document.getElementById(a.dataset.target);
        if (el) {
          if (el.tagName === 'DETAILS') el.open = true;
          window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 108, behavior: 'smooth' });
        }
      }, 180);
    });
  });
}
function openToc() { $('#tocMask').classList.add('on'); $('#tocPanel').classList.add('on'); }
function closeToc() { $('#tocMask').classList.remove('on'); $('#tocPanel').classList.remove('on'); }
$('#tocBtn').onclick = openToc;
$('#tocClose').onclick = closeToc;
$('#tocMask').onclick = closeToc;
$('#backBtn').onclick = () => { history.length > 1 ? history.back() : location.hash = '#/'; };

/* ================= 进度条 ================= */
window.addEventListener('scroll', () => {
  if (!curDocId) return;
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $('#progress').style.width = max > 0 ? (h.scrollTop / max * 100) + '%' : '0%';
  if (curDocId) store.set('pos-' + curDocId, window.scrollY);
  syncToTop();
}, { passive: true });

render();
</script>
